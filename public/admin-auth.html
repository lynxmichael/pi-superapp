<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Authentification | Pi SuperApp</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 460px;
        }

        .auth-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .auth-header {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            padding: 30px;
            text-align: center;
            color: white;
        }

        .auth-header h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .auth-header p {
            opacity: 0.9;
            font-size: 0.95rem;
        }

        .auth-tabs {
            display: flex;
            border-bottom: 1px solid #e5e7eb;
        }

        .auth-tab {
            flex: 1;
            padding: 16px;
            background: none;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            color: #6b7280;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .auth-tab.active {
            color: #4f46e5;
            border-bottom: 2px solid #4f46e5;
        }

        .auth-body {
            padding: 30px;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #374151;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(79,70,229,0.4);
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            color: #6b7280;
            font-size: 0.9rem;
        }

        .auth-footer a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .input-hint {
            font-size: 0.8rem;
            color: #9ca3af;
            margin-top: 4px;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1><i class="fas fa-shield-alt"></i> Admin Panel</h1>
                <p>Espace d'administration Pi SuperApp</p>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" id="loginTab">Connexion</button>
                <button class="auth-tab" id="registerTab">Inscription</button>
            </div>

            <div class="auth-body">
                <!-- Message d'alerte dynamique -->
                <div id="alertMessage" style="display: none;"></div>

                <!-- Formulaire de connexion -->
                <form id="loginForm" class="auth-form active">
                    <div class="form-group">
                        <label>Email ou nom d'utilisateur</label>
                        <input type="text" id="loginIdentifier" placeholder="exemple@email.com" required>
                    </div>
                    <div class="form-group">
                        <label>Mot de passe (PIN)</label>
                        <input type="password" id="loginPassword" placeholder="6 chiffres" pattern="[0-9]{6}" maxlength="6" required>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-sign-in-alt"></i> Se connecter
                    </button>
                    <div class="auth-footer">
                        <a href="#" id="switchToRegister">Créer un compte administrateur</a>
                    </div>
                </form>

                <!-- Formulaire d'inscription -->
                <form id="registerForm" class="auth-form">
                    <div class="form-group">
                        <label>Nom d'utilisateur Pi</label>
                        <input type="text" id="regPiUsername" placeholder="johndoe" required minlength="3" maxlength="50">
                    </div>
                    <div class="form-group">
                        <label>Pi UID</label>
                        <input type="text" id="regPiUid" placeholder="Votre identifiant Pi" required>
                        <div class="input-hint">Disponible dans l'application Pi</div>
                    </div>
                    <div class="form-group">
                        <label>Adresse du wallet Pi</label>
                        <input type="text" id="regWallet" placeholder="GB... ou G..." required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="regEmail" placeholder="admin@exemple.com" required>
                    </div>
                    <div class="form-group">
                        <label>Téléphone (optionnel)</label>
                        <input type="tel" id="regPhone" placeholder="+33612345678">
                    </div>
                    <div class="form-group">
                        <label>Code secret admin</label>
                        <input type="password" id="regAdminCode" placeholder="Code d'invitation" required>
                        <div class="input-hint">Requis pour créer un compte admin</div>
                    </div>
                    <div class="form-group">
                        <label>PIN de connexion (6 chiffres)</label>
                        <input type="password" id="regPin" placeholder="123456" pattern="[0-9]{6}" maxlength="6" required>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-user-plus"></i> S'inscrire
                    </button>
                    <div class="auth-footer">
                        <a href="#" id="switchToLogin">Déjà un compte ? Se connecter</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/admin-auth.js"></script>
</body>
</html>
